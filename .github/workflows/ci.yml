name: Phase 0 quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install -r requirements.lock
      - name: Install local package
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Configuration smoke test
        run: product-insights config-check
      - name: Format
        run: ruff format --check .
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src tests scripts
      - name: Unit and privacy tests
        run: pytest
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: Dependency audit
        run: pip-audit -r requirements.lock
